name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  # Required for npm provenance.
  id-token: write

jobs:
  # Publishing is gated on the same pipeline CI runs — including the packed
  # consumer test. This job existing, and `release` needing it, is the whole
  # point: a push to main used to start CI and Release in parallel, so nothing
  # stopped a publish from racing ahead of (or straight past) a failing check.
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # No pending changesets means nothing to release, and every step below is
      # skipped rather than run against an unchanged tree. Most pushes to main
      # land here and stop.
      - id: pending
        run: |
          count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count changeset(s) pending"

      # Consumes the changesets: bumps the version and writes CHANGELOG.md.
      - if: steps.pending.outputs.count != '0'
        run: pnpm version-packages

      # Committed but deliberately NOT pushed yet — see the push step below for
      # why the ordering matters.
      - if: steps.pending.outputs.count != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: version packages'

      # Builds, then publishes whatever version is now in package.json.
      # `changeset publish` checks the registry first and skips anything already
      # there, so a re-run cannot double-publish.
      - if: steps.pending.outputs.count != '0'
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signs each publish with a link back to the commit and workflow that
          # built it. Needs a public repo, a public package and the id-token
          # permission above — all three now hold.
          NPM_CONFIG_PROVENANCE: true

      # Last, because npm is the half that cannot be undone. If the publish
      # above fails, main still has its changesets and nothing was pushed, so
      # re-running is a clean retry. Pushing first would consume the changesets
      # and leave a failed publish with nothing left to trigger it.
      #
      # This push does not start another Release run: pushes authenticated with
      # GITHUB_TOKEN deliberately do not trigger workflows, which is what stops
      # this job from looping into itself.
      - if: steps.pending.outputs.count != '0'
        run: |
          git push origin HEAD:main
          git push origin --tags
